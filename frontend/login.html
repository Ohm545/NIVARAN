<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — NIVARAN</title>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/login.css" />

  <script type="module" src="js/pages/login.page.js"></script>
</head>
<body class="login-body">

  <div class="login-container">

    <!-- Brand -->
    <div class="login-brand">
      <svg class="login-brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 9h6M9 12h6M9 15h4"/>
      </svg>
      <span class="login-brand-name">NIVARAN</span>
    </div>

    <p class="login-descriptor">Evidence-Driven Government Innovation Procurement</p>

    <!-- Card -->
    <div class="login-card">
      <h1 class="login-title">Sign In</h1>
      <p class="login-subtitle">Use your government account credentials.</p>

      <!-- Error / info message area -->
      <div id="login-alert" class="alert alert-danger hidden" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@organisation.gov.in"
            required
          />
          <span class="form-error hidden" id="email-error"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              <!-- Eye icon — shown when password is hidden -->
              <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye-off icon — shown when password is visible -->
              <svg id="icon-eye-off" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a18.9 18.9 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="form-error hidden" id="password-error"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <span id="login-btn-text">Sign In</span>
          <span id="login-spinner" class="spinner spinner-sm hidden" aria-hidden="true"></span>
        </button>

      </form>
    </div>

    <p class="login-footer-note">
      NIVARAN &mdash; Government Innovation Procurement Platform
    </p>
  </div>

</body>
</html>
