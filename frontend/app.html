<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIVARAN</title>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/app-shell.css" />

  <script type="module" src="js/app-shell.js"></script>
</head>
<body class="shell-body">

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <svg class="sidebar-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M9 9h6M9 12h6M9 15h4"/>
      </svg>
      <span class="sidebar-logo-text">NIVARAN</span>
    </div>

    <nav class="sidebar-nav" aria-label="Primary navigation">
      <ul id="sidebar-nav-list" class="sidebar-nav-list">
        <!-- Rendered by app-shell.js -->
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div id="user-context" class="user-context">
        <!-- Rendered by app-shell.js -->
      </div>
      <button id="logout-btn" class="sidebar-logout-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main area -->
  <div class="shell-main">
    <!-- Top bar -->
    <header class="shell-topbar">
      <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Toggle sidebar" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div id="topbar-context" class="topbar-context"></div>
    </header>

    <!-- Page content -->
    <main id="page-content" class="page-content" role="main">
      <!-- Content rendered by page modules -->
    </main>
  </div>

</body>
</html>
